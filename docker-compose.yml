services:
  db:
    image: postgres:16-alpine
    container_name: sirkula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sirkula}
      POSTGRES_USER: ${DB_USERNAME:-sirkula}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  adminer:
    container_name: adminer
    image: adminer
    restart: no
    ports:
      - 8080:8080

volumes:
  postgres_data:
    driver: local
