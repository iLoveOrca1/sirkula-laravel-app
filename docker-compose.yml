services:
  db:
    image: postgres:16-alpine
    container_name: sirkula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sirkula}
      POSTGRES_USER: ${DB_USERNAME:-sirkula}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sirkula} -d ${DB_DATABASE:-sirkula}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
