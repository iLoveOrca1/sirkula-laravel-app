services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: sirkula_laravel
        restart: unless-stopped

        working-dir: /var/www/sirkula

        volumes:
            - .:/var/www/sirkula

        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - DB_CONNECTION=pgsql
            - DB_HOST=pgsql
            - DB_PORT=5432

        depends_on:
            - pgsql
        networks:
            - sail

    nginx:
        image: 'nginx:16-alpine'
        container_name: sirkula_nginx
        restart: unless-stopped

        ports:
            - "9000:80"

        volumes:
            - ./public:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

        networks:
            - sail

    pgsql:
        image: 'postgres:16-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-sirkula}'
            POSTGRES_USER: '${DB_USERNAME:-sirkula}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
        restart: unless-stopped
# Jaringan (networks) dan volumes didefinisikan di level terluar (paling kiri/bawah)
networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
