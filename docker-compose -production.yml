services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: sirkula_laravel
        restart: unless-stopped

        working_dir: /var/www/html

        volumes:
            - .:/var/www/html
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache

        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - DB_CONNECTION=pgsql
            - DB_HOST=pgsql
            - DB_PORT=5432

        depends_on:
            - pgsql
        networks:
            - sail

    nginx:
        image: 'nginx:alpine'
        container_name: sirkula_nginx
        restart: unless-stopped

        ports:
            - "80:80"
            - "443:443"

        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot:ro

        depends_on:
            - app

        networks:
            - sail

    certbot:
        image: 'certbot/certbot'
        container_name: sirkula_certbot

        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
            - ./certbot/log:/var/log/letsencrypt

        command: certonly --webroot -w /var/www/certbot --email {email} -d {domain} --agree-tos

        depends_on:
            - nginx

    pgsql:
        image: 'postgres:16-alpine'
        container_name: sirkula_pgsql
        restart: unless-stopped

        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'

        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'

        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-sirkula}'
            POSTGRES_USER: '${DB_USERNAME:-sirkula}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'

        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
